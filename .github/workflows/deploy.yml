name: Deploy Hexo Blog to GitHub Pages

on:
  # 当推送到 dev 分支时触发部署
  push:
    branches: [dev]
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build Hexo
        run: |
          npx hexo clean
          npx hexo generate

      - name: Copy additional files
        run: |
          cp 404.html public/404.html
          cp baidu_verify_hTO3FZGPz7.html public/baidu_verify_hTO3FZGPz7.html
          cp README-master.md public/README.md
          cp LICENSE public/LICENSE
          mkdir -p public/about
          cp weichat.html public/about/weichat.html
          cp sogrey.html public/about/sogrey.html
          cp mit.html public/about/mit.html
          cp apache2.0.html public/about/apache2.0.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
